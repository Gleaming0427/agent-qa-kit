name: QA agent kit - security, evidence and demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pinned, not ubuntu-latest: the screenshot baselines depend on the runner's fonts.

jobs:
  deterministic-controls:
    name: Guards + verdict evidence (no AI / no tokens)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Type-check the kit scripts
        run: npm run typecheck
      - name: Check existing hook guards
        run: bash qa/test-guard.sh
      - name: Check existing verdict tests
        run: bash qa/test-verdict-check.sh
      - name: Check branch rules on a test git history
        run: bash qa/test-check-scope.sh
      - name: Strict evidence regression suite
        run: node --test qa/tests/*.test.ts
      - name: Check for skipped / focused tests
        run: node qa/check-tests.ts
      - name: Validate authoritative ticket manifest
        run: node qa/criteria-manifest.ts TICKET-42 specs/TICKET-42.md /tmp/TICKET-42-criteria.json

  react-demo:
    name: React MFE + Playwright red/green/regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/server-console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Critical user journey smoke test (desktop + mobile, screenshots compared)
        id: smoke
        run: |
          if ls e2e/smoke.spec.ts-snapshots/*.png >/dev/null 2>&1; then
            npm run test:smoke
          else
            # No baselines committed yet: create them on this CI machine and publish them.
            npm run test:smoke -- --update-snapshots=all
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Screenshots were created, not compared. Commit the screenshot-baselines artifact to examples/server-console/e2e/smoke.spec.ts-snapshots/."
          fi
      - name: Upload new screenshot baselines
        if: steps.smoke.outputs.created == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-baselines
          path: examples/server-console/e2e/smoke.spec.ts-snapshots/
      - run: npm run demo:unit
      - run: npm run demo:e2e
      - name: Final full suite on the current code
        run: npm run verify:final
      - name: Upload demo reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-demo-reports
          path: |
            examples/server-console/reports/
            examples/server-console/test-results/
          if-no-files-found: ignore
