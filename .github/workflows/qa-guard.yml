name: QA agent kit - security, evidence and demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pinned, not ubuntu-latest: a new runner image should not change a run that did not change.

jobs:
  deterministic-controls:
    name: Guards + verdict evidence (no AI / no tokens)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Type-check the kit scripts
        run: npm run typecheck
      - name: Check existing hook guards
        run: bash qa/test-guard.sh
      - name: Check existing verdict tests
        run: bash qa/test-verdict-check.sh
      - name: Check branch rules on a test git history
        run: bash qa/test-check-scope.sh
      - name: Strict evidence regression suite
        run: node --test qa/tests/*.test.ts
      - name: Check for skipped / focused tests
        run: node qa/check-tests.ts
      - name: Validate authoritative ticket manifest
        run: |
          node qa/criteria-manifest.ts TICKET-42 specs/TICKET-42.md /tmp/TICKET-42-criteria.json
          node qa/criteria-manifest.ts TICKET-44 specs/TICKET-44.md /tmp/TICKET-44-criteria.json

  react-demo:
    name: React MFE + Playwright red/green/regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Critical user journey smoke test (desktop + mobile)
        run: npm run test:smoke
      - run: npm run demo:unit
      - run: npm run demo:e2e
      - name: Final full suite on the current code
        run: npm run verify:final
      - name: Install the kit for the visual review
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: AI visual review of the smoke screenshots (warnings only)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node ../../qa/visual-review.ts reports/screens reports/visual-review.json
      - name: Upload demo reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-demo-reports
          path: |
            examples/shop/reports/
            examples/shop/test-results/
          if-no-files-found: ignore
