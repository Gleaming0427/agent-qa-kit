name: QA guard

on:
  pull_request:

jobs:
  qa-scope:
    # QA agent branch: it must contain tests only.
    if: startsWith(github.head_ref, 'qa/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that only tests are modified
        env:
          BASE: ${{ github.base_ref }}
        run: qa/check-scope.sh scope "origin/$BASE"

  frozen-tests:
    # Development branch: the tests written by the QA agent have not changed.
    if: startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the QA agent's tests are intact
        env:
          BASE: ${{ github.base_ref }}
        run: |
          TICKET="${GITHUB_HEAD_REF#feat/}"
          [[ "$TICKET" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]] || { echo "Unexpected branch name: $GITHUB_HEAD_REF"; exit 1; }
          qa/check-scope.sh frozen "origin/$BASE" "origin/qa/$TICKET"

  tests-on-clean-code:
    # The tests are run again here, on the real code, outside the agents' environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile # adapt to your Yarn version
      - run: npx playwright install --with-deps chromium
      - run: npm run test:affected
      - run: npm run test:e2e
