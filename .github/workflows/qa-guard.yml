name: QA agent kit - security, evidence and demo
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-controls:
    name: Guards + verdict evidence (no AI / no tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Type-check the kit scripts
        run: npm run typecheck
      - name: Check existing hook guards
        run: bash qa/test-guard.sh
      - name: Check existing verdict tests
        run: bash qa/test-verdict-check.sh
      - name: Strict evidence regression suite
        run: node --test qa/tests/*.test.ts
      - name: Check for skipped / focused tests
        run: node qa/check-tests.ts
      - name: Validate authoritative ticket manifest
        run: node qa/criteria-manifest.ts TICKET-42 specs/TICKET-42.md /tmp/TICKET-42-criteria.json

  react-demo:
    name: React MFE + Playwright red/green/regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/server-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Critical user journey smoke test
        run: npm run test:smoke
      - run: npm run demo:unit
      - run: npm run demo:e2e
      - name: Final full suite on the current code
        run: npm run verify:final
      - name: Upload demo reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-demo-reports
          path: examples/server-console/reports/
          if-no-files-found: ignore

  qa-scope:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: QA branch may only change tests
        env:
          BASE: ${{ github.base_ref }}
        run: qa/check-scope.sh scope "origin/$BASE"

  frozen-tests:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Development agent cannot alter QA tests
        env:
          BASE: ${{ github.base_ref }}
        run: |
          TICKET="${GITHUB_HEAD_REF#feat/}"
          if [[ ! "$TICKET" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]]; then
            echo "No ticket ID in $GITHUB_HEAD_REF; frozen-tests applies to feat/TICKET-123 branches."
            exit 0
          fi
          git fetch --no-tags origin "qa/$TICKET:refs/remotes/origin/qa/$TICKET"
          qa/check-scope.sh frozen "origin/$BASE" "origin/qa/$TICKET"
