name: QA eval
# Started by hand. Runs the QA agents on the evaluation corpus (eval/tickets): several trials
# per ticket, then aggregates the metrics. See eval/README.md.
#
# Each trial runs on three runners, so that the agent never shares one with the corpus, and the
# code it wrote never shares one with a secret:
#   agent     the agent bundle only (no checkout, no git history, no corpus but the spec); the API
#             key reaches the phase 1 step only.
#   scoring   a checkout with the corpus, no secret; the generated tests run in a sandbox without
#             network, environment or a view of the corpus.
#   verifier  the agent bundle, the agent's workspace and the two implementations to verify, under
#             neutral names; the API key reaches the phase 2 step only.
# The report job assembles the three parts of each trial and computes the metrics.
on:
  workflow_dispatch:
    inputs:
      tickets:
        description: Eval tickets, separated by spaces, "all", or "smoke" (a few tickets chosen from the history, see eval/smoke.ts)
        required: true
        default: all
        type: string
      trials:
        description: Trials per ticket (1-10)
        required: true
        default: '3'
        type: string
      max_parallel:
        description: Trials running at the same time (1-20)
        required: true
        default: '6'
        type: string
      verify:
        description: Also run phase 2 (the verifier) on the reference implementation and on one bug
        required: true
        default: true
        type: boolean
      dry_run:
        description: No model call; the hidden reference tests stand in for the agent's tests (checks the harness)
        required: true
        default: false
        type: boolean
      recheck:
        description: Instead of running trials, aggregate earlier QA eval runs again with the current code (run ids, separated by spaces)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: qa-eval
  cancel-in-progress: false

env:
  EVAL_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

jobs:
  plan:
    name: Plan the trials and build the agent bundle
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      recheck: ${{ steps.plan.outputs.recheck }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: plan
        env:
          TICKETS: ${{ inputs.tickets }}
          TRIALS: ${{ inputs.trials }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          RECHECK: ${{ inputs.recheck }}
        run: node eval/plan.ts >> "$GITHUB_OUTPUT"
      - name: Build the agent bundle, and check it holds no trace of the corpus
        if: ${{ inputs.recheck == '' }}
        env:
          TICKET_LIST: ${{ steps.plan.outputs.tickets }}
        run: |
          # shellcheck disable=SC2086 # one argument per ticket
          node eval/bundle.ts build "$RUNNER_TEMP/agent-bundle" $TICKET_LIST
          # A tar keeps the executable bits, which an artifact drops: the guard hook needs its own.
          tar -cf "$RUNNER_TEMP/agent-bundle.tar" -C "$RUNNER_TEMP/agent-bundle" .
      - name: Upload the agent bundle
        if: ${{ inputs.recheck == '' }}
        uses: actions/upload-artifact@v6
        with:
          name: agent-bundle
          path: ${{ runner.temp }}/agent-bundle.tar
          if-no-files-found: error

  agent:
    name: ${{ matrix.ticket }}-${{ matrix.trial }} agent
    needs: plan
    if: ${{ inputs.recheck == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TICKET: ${{ matrix.ticket }}
      TRIAL: ${{ matrix.trial }}
      # The agents work in examples/shop of the bundle, as in "QA write tests".
      EVAL_IN_PLACE: '1'
    steps:
      # No checkout: this runner never holds the repository, its history or the corpus.
      - uses: actions/download-artifact@v7
        with:
          name: agent-bundle
          path: ${{ runner.temp }}
      - name: Unpack the agent bundle
        run: |
          tar -xf "$RUNNER_TEMP/agent-bundle.tar" -C "$GITHUB_WORKSPACE"
          rm "$RUNNER_TEMP/agent-bundle.tar"
          echo "EVAL_WORK=$RUNNER_TEMP/eval" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the bundle before anything runs
        run: |
          node eval/bundle.ts verify
          echo "EVAL_BUNDLE_VERIFIED=1" >> "$GITHUB_ENV"
      - name: Install the shop and its browser
        working-directory: examples/shop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install Claude Code and the agent sandbox
        if: ${{ !inputs.dry_run }}
        run: bash qa/ci-install-agents.sh
      - name: Prepare a fresh workspace
        run: node eval/trial.ts prepare "$TICKET" "$TRIAL"
      - name: Phase 1, QA writer agent
        if: ${{ !inputs.dry_run }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: 1
        run: node eval/trial.ts write "$TICKET" "$TRIAL"
      - name: Phase 1, dry run (no agent; the scoring runner puts the hidden tests in place)
        if: ${{ inputs.dry_run }}
        run: node eval/trial.ts write "$TICKET" "$TRIAL"
      - name: Upload what the agent produced
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-out-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/agent/
          if-no-files-found: warn

  score:
    name: ${{ matrix.ticket }}-${{ matrix.trial }} scoring
    needs: [plan, agent]
    if: ${{ always() && inputs.recheck == '' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TICKET: ${{ matrix.ticket }}
      TRIAL: ${{ matrix.trial }}
      # The generated tests are the agent's code: they run in the sandbox, which fails closed.
      EVAL_SANDBOX: bwrap
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Locate the trial
        run: echo "EVAL_WORK=$RUNNER_TEMP/eval" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        # A failed agent job may have sent nothing back: the trial is then recorded as an agent error.
        continue-on-error: true
        with:
          name: agent-out-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/agent
      - uses: actions/download-artifact@v7
        with:
          name: agent-bundle
          path: ${{ runner.temp }}
      - name: Read the bundle's manifest (the shop the agent worked on)
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xf "$RUNNER_TEMP/agent-bundle.tar" -C "$RUNNER_TEMP/bundle" ./eval/bundle-manifest.json
          echo "EVAL_BUNDLE_MANIFEST=$RUNNER_TEMP/bundle/eval/bundle-manifest.json" >> "$GITHUB_ENV"
      - name: Install the shop and its browser
        working-directory: examples/shop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install the scoring sandbox
        run: bash eval/ci/install-sandbox.sh
      - name: Score the generated tests (no model call, sandboxed)
        run: node eval/trial.ts score "$TICKET" "$TRIAL"
      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: score-out-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/score/
          if-no-files-found: warn
      - name: Upload the implementations for phase 2
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verifier-in-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/verify-input/
          if-no-files-found: warn

  verify:
    name: ${{ matrix.ticket }}-${{ matrix.trial }} verifier
    needs: [plan, score]
    if: ${{ always() && inputs.recheck == '' && inputs.verify && !inputs.dry_run && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TICKET: ${{ matrix.ticket }}
      TRIAL: ${{ matrix.trial }}
      EVAL_IN_PLACE: '1'
    steps:
      # No checkout, as for the agent: the bundle, then the agent's workspace.
      - uses: actions/download-artifact@v7
        with:
          name: agent-bundle
          path: ${{ runner.temp }}
      - name: Unpack the agent bundle
        run: |
          tar -xf "$RUNNER_TEMP/agent-bundle.tar" -C "$GITHUB_WORKSPACE"
          rm "$RUNNER_TEMP/agent-bundle.tar"
          echo "EVAL_WORK=$RUNNER_TEMP/eval" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the bundle before anything runs
        run: node eval/bundle.ts verify
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: agent-out-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/agent
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: verifier-in-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/verify-input
      - id: input
        name: Is there anything to verify?
        run: |
          input="$EVAL_WORK/$TICKET-$TRIAL/verify-input/verify.json"
          if [[ -f "$input" ]] && [[ "$(jq -r '.run' "$input")" == true ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install the shop and its browser
        if: ${{ steps.input.outputs.run == 'true' }}
        working-directory: examples/shop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install Claude Code and the agent sandbox
        if: ${{ steps.input.outputs.run == 'true' }}
        run: bash qa/ci-install-agents.sh
      - name: Phase 2, QA verifier agent
        if: ${{ steps.input.outputs.run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: 1
        run: node eval/trial.ts verify "$TICKET" "$TRIAL"
      - name: Phase 2 skipped
        if: ${{ steps.input.outputs.run != 'true' }}
        run: node eval/trial.ts verify "$TICKET" "$TRIAL"
      - name: Upload the verifier's verdicts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verifier-out-${{ matrix.ticket }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/eval/${{ matrix.ticket }}-${{ matrix.trial }}/verify/
          if-no-files-found: warn

  report:
    name: Assemble the trials and aggregate the metrics
    needs: [plan, agent, score, verify]
    if: ${{ always() && inputs.recheck == '' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-out-*'
          path: ${{ runner.temp }}/parts
      - name: Assemble each trial from its three runners
        run: |
          export EVAL_WORK="$RUNNER_TEMP/eval"
          for dir in "$RUNNER_TEMP"/parts/*-out-*; do
            name="${dir##*/}"
            case "$name" in
              agent-out-*) part=agent; trial="${name#agent-out-}" ;;
              score-out-*) part=score; trial="${name#score-out-}" ;;
              verifier-out-*) part=verify; trial="${name#verifier-out-}" ;;
              *) continue ;;
            esac
            mkdir -p "$EVAL_WORK/$trial"
            mv "$dir" "$EVAL_WORK/$trial/$part"
          done
          node eval/trial.ts finish-all
      - name: Compute the report
        run: |
          node eval/lib/aggregate.ts "$RUNNER_TEMP/eval" "$RUNNER_TEMP/eval-report.json" "$RUNNER_TEMP/eval-report.md"
          cat "$RUNNER_TEMP/eval-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record the campaign for the history (eval/history)
        env:
          EVAL_INPUTS: ${{ toJSON(inputs) }}
          HISTORY_LABEL: ${{ inputs.tickets == 'smoke' && format('smoke, run {0}', github.run_number) || '' }}
        run: node eval/history.ts from-report "$RUNNER_TEMP/eval-report.json" "$RUNNER_TEMP/eval-history.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-report
          path: |
            ${{ runner.temp }}/eval-report.json
            ${{ runner.temp }}/eval-report.md
            ${{ runner.temp }}/eval-history.json
          if-no-files-found: warn
      - name: Upload the assembled trials
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-trials
          path: ${{ runner.temp }}/eval/*/trial/
          if-no-files-found: warn

  recheck:
    # An earlier campaign, aggregated again with the current code: its trial records, transcripts and
    # CLI results are read from that run's artifacts, so new checks also cover old campaigns. Nothing
    # from the artifacts is run; the token can only read Actions data.
    name: Recheck run ${{ matrix.run }}
    needs: plan
    if: ${{ inputs.recheck != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.recheck) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          # eval-<TICKET>-<TRIAL> for campaigns run on one runner per trial, eval-trials since the split.
          pattern: eval-*
          path: ${{ runner.temp }}/trials
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: Aggregate with the current code
        env:
          RUN: ${{ matrix.run }}
        run: |
          node eval/lib/aggregate.ts "$RUNNER_TEMP/trials" "$RUNNER_TEMP/recheck-$RUN.json" "$RUNNER_TEMP/recheck-$RUN.md"
          { echo "## Run $RUN"; echo; cat "$RUNNER_TEMP/recheck-$RUN.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recheck-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/recheck-${{ matrix.run }}.json
            ${{ runner.temp }}/recheck-${{ matrix.run }}.md
          if-no-files-found: warn
