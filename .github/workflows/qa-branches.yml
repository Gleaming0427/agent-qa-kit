name: QA branch rules
on:
  pull_request:

permissions:
  contents: read

jobs:
  qa-branch-rules:
    name: QA branch rules (scope + frozen tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # The rules as the base branch has them: a pull request cannot loosen the check that judges it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: base-kit
          sparse-checkout: qa
          persist-credentials: false
      # The checks that read the test files are Node.js scripts.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pick the rules
        run: |
          if [ -f base-kit/qa/check-scope.sh ]; then
            echo "QA_SCOPE=$PWD/base-kit/qa/check-scope.sh" >> "$GITHUB_ENV"
          else
            echo "::warning title=QA branch rules::The base branch has no kit yet (a first install): this run uses the pull request's own copy of the rules."
            echo "QA_SCOPE=$PWD/qa/check-scope.sh" >> "$GITHUB_ENV"
          fi
      - name: Fetch the base branch and every qa/ branch
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" '+refs/heads/qa/*:refs/remotes/origin/qa/*'
      - name: A QA branch may only add tests, and change only its own
        if: startsWith(github.head_ref, 'qa/')
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ticket="$(grep -xE '[A-Z][A-Z0-9]*-[0-9]+' <<<"${HEAD_REF#qa/}" || true)"
          bash "$QA_SCOPE" scope "origin/$BASE" ${ticket:+"$ticket"}
      - name: Tests of a ticket stay frozen, and no pull request changes another ticket's tests
        env:
          BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash "$QA_SCOPE" pr "origin/$BASE" "$GITHUB_HEAD_REF" "$PR_TITLE"
