name: QA verify
# On a pull request that names a ticket with QA tests (in its branch or title):
# the tests must be the ones a collaborator approved, the QA verifier agent checks
# every acceptance criterion, then the full suite runs. Make "QA verify" a
# required check to block the merge when it fails. Other pull requests pass.
# With the repository variable QA_VERIFY_MODE=advisory, failures are warnings
# only, until the track record (qa-verify-record artifacts, qa/verify-record.ts)
# shows the check can block.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: QA verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Repository variable: "advisory" reports failures as warnings without blocking, to build a
      # track record first; unset or "blocking" fails the check (see HOW_TO_APPLY.md).
      QA_VERIFY_MODE: ${{ vars.QA_VERIFY_MODE || 'blocking' }}
      # Repository variable: "warn" (the default) says when the pull request changes how its own tests
      # run; "block" fails the check instead.
      QA_VERIFY_TOOLING: ${{ vars.QA_VERIFY_TOOLING || 'warn' }}
      QA_VERIFY_RECORD: ${{ github.workspace }}/qa-verify-record.jsonl
      # The kit runs from a copy of the base branch's kit that the pull request's code cannot change,
      # not from the pull request's own scripts (qa/ci-trusted-kit.sh).
      QA_KIT: /opt/qa-kit
      QA_REPO_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # No token on disk while the agent and the pull request's code run.
          persist-credentials: false
      # The kit as the base branch has it: a pull request is not judged by scripts it can change.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.base_ref }}
          path: base-kit
          sparse-checkout: |
            qa
            .claude
          persist-credentials: false
      - name: Take the kit from the base branch
        run: |
          if [ -f base-kit/qa/ci-trusted-kit.sh ]; then
            bash base-kit/qa/ci-trusted-kit.sh base-kit
            echo "QA_KIT_FROM=base" >> "$GITHUB_ENV"
          elif [ -f qa/ci-trusted-kit.sh ]; then
            echo "::warning title=QA verify::The base branch has no kit that can run from a copy yet (a first install, or an upgrade): this run uses the pull request's own copy of the kit."
            bash qa/ci-trusted-kit.sh .
            echo "QA_KIT_FROM=pull-request" >> "$GITHUB_ENV"
          else
            echo "::error title=QA verify::Neither the base branch nor this pull request has qa/ci-trusted-kit.sh: upgrade the kit (npx github:Gleaming0427/agent-qa-kit init)."
            exit 1
          fi
          rm -rf base-kit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check that the tests are the approved ones
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$QA_KIT/qa/ci-verify.sh" prepare
      # The kit's scripts above ran on Node.js 22; the application gets its own version from here
      # (.nvmrc or .node-version, else 22: qa/ci-node-version.sh, chosen in the prepare step).
      - name: Use the application's Node.js version
        if: steps.prepare.outputs.count != '0'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.prepare.outputs.node }}
      - name: Install the application, its browser and the agent sandbox
        if: steps.prepare.outputs.count != '0'
        run: bash "$QA_KIT/qa/ci-verify.sh" install
      - name: QA verifier agent checks each criterion (phase 2)
        if: steps.prepare.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variable: more turns for the agent on a large application (its own limit when unset).
          QA_MAX_TURNS: ${{ vars.QA_MAX_TURNS }}
          DISABLE_AUTOUPDATER: 1
        run: bash "$QA_KIT/qa/ci-verify.sh" agent
      # A step of its own, without the API key: the pull request's code runs here.
      - name: Full suite, smoke journeys included
        if: steps.prepare.outputs.count != '0'
        run: bash "$QA_KIT/qa/ci-verify.sh" suite
      - name: Upload the outcome of each check (the track record)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-verify-record
          path: qa-verify-record.jsonl
          if-no-files-found: ignore
      - name: Upload the QA reports (even on failure)
        if: always() && steps.prepare.outputs.count != '0'
        uses: actions/upload-artifact@v6
        with:
          name: qa-verify-reports
          path: |
            **/reports/
            **/test-results/
            !**/node_modules/**
          if-no-files-found: ignore
